/* ---------- mode survie ---------- */
const SURV={on:false};
const SURV_HEAL=.75, SURV_REVIVE=.5, SURV_REST=5;
const survHpMul=n=>.5+.05*(n-1);
function survFoe(n,mine){
  const b=Math.min(BUDGET,3+n), mx=Math.min(TEAM_MAX,2+Math.floor((n-1)/2));
  let pool=Object.keys(FIGHTERS).filter(f=>!mine.includes(f)); if(pool.length<6) pool=Object.keys(FIGHTERS);
  for(let k=0;k<300;k++){ const t=[]; let c=0;
    for(const f of shuffle(pool.slice())){ if(t.length>=mx) break; if(c+(COST[f]||3)<=b){ t.push(f); c+=COST[f]||3; } }
    if(t.length>=TEAM_MIN && c>=b-1) return t; }
  return randomTeam(mine);
}
function survStart(team){
  Object.assign(SURV,{on:true,wave:1,team:team.slice(),hp:null,max:null,foe:survFoe(1,team),best:(ACC.user&&ACC.user.stats&&ACC.user.stats.surv)||0});
  renderSurvWave();
}
function survPrep(st){
  const n=SURV.wave; st.surv=n; st.log=L("survWave",n)+" · "+L("start");
  st.aiSkill=Math.min(1,.4+.1*(n-1));
  if(SURV.hp){ const s=st.p;
    s.team.forEach((t,i)=>{ t.max=SURV.max[i]; t.hp=SURV.hp[i]; t.ko=t.hp<=0; });
    const dead=new Set(s.team.filter(t=>t.ko).map(t=>t.id)); const keep=x=>!dead.has(CARDS[x.k].owner);
    s.draw=s.draw.filter(keep); s.active=Math.max(0,s.team.findIndex(t=>!t.ko)); }
  { const m=survHpMul(n); st.a.team.forEach(t=>{ t.max=t.hp=Math.max(4,Math.round(t.max*m)); }); }
  if(n>7) st.a.rage=Math.min(RAGE_MAX-2,Math.floor((n-6)/2));
}

  return `<div class="svf ${ko?"ko":""} cl-${CLAN[id]}" title="${esc(nm(id))}"><img src="${FACE(id)}" alt="">${ko?`<span class="kox">KO</span>`:""}${h!=null&&!ko?`<span class="rhp ${h<m?"hurt":""}"><i style="width:${h/m*100}%"></i></span><span class="rhpn">${h}/${m}</span>`:""}</div>`; }).join("")}</div>`; }

async function survReport(wave,win){

function survAfter(win){ rpCapture(true);

    ${win?`<p class="note">${note}</p>${survFaces(SURV.team,SURV.hp,SURV.max)}`:""}
    ${rec&&!win?`<p class="note lvlup">${L("survNewRec")}</p>`:""}

function quitPress(b){
    if(RP.on){ SFX.play("click"); rpStop(); return; }

    QUIT_ARM=false; clearTimeout(QUIT_T);
    SFX.play("click"); const coach=document.querySelector(".coach-wrap,.coach"); if(coach) coach.remove();
    if(S && !S.over && ACC.user){ if(MODE==="vs") accMatchEnd(true); else if(MODE==="solo"){ if(SURV.on) survReport(SURV.wave,false); else accReportSolo(false); } }
    const tc=MODE==="vs"?TOUR.code:null;
    if(S){ S.over=true; S.dead=true; } if(MODE==="vs") netLeave(); else { MODE="solo"; ME="p"; } if(tc) renderTour(tc); else renderTitle(); }

/* ---------- niveaux des joueurs (calculés à partir des points cumulés) ---------- */
const LVL_MAX=50;
const lvlNeed=n=>25*(n-1)*n;                       // points totaux pour atteindre le niveau n : 0, 50, 150, 300, 500…
function lvlOf(pts){ pts=+pts||0; let n=1; while(n<LVL_MAX && pts>=lvlNeed(n+1)) n++; const a=lvlNeed(n), b=lvlNeed(Math.min(n+1,LVL_MAX)); return {n, cur:pts-a, need:b-a, pct:n>=LVL_MAX?100:Math.floor((pts-a)/(b-a)*100)}; }
const LVL_TITLES=[[1,"lt1"],[3,"lt3"],[5,"lt5"],[8,"lt8"],[12,"lt12"],[16,"lt16"],[20,"lt20"],[25,"lt25"],[30,"lt30"],[40,"lt40"]];
function lvlTitle(n){ let k="lt1"; for(const [m,t] of LVL_TITLES) if(n>=m) k=t; return L(k); }
function lvlBadge(pts,cls=""){ const v=lvlOf(pts); return `<span class="lvlb ${cls}" title="${esc(lvlTitle(v.n))}">${L("lvShort")} ${v.n}</span>`; }

function bindAccForms(done){
  const go=async(form,reg)=>{
    const fd=new FormData(form), err=form.querySelector(".err"), name=String(fd.get("name")||"").trim(), pw=String(fd.get("password")||"");

    if(reg && pw!==String(fd.get("password2")||"")){ err.textContent=L("e_match"); return; }
    const btn=form.querySelector("button"); btn.disabled=true;
    try{ const r=await api("POST",reg?"/api/register":"/api/login",{name,password:pw});
      if(!r.ok){ err.textContent=accErr(r.error); btn.disabled=false; return; }
      ACC.token=r.token; ACC.user=r.user; ACC.ready=true; try{ localStorage.setItem("boc-token",r.token); localStorage.setItem("doom-nick",r.user.name); }catch(e){}
      SFX.play("event"); await accInit(); done();
    }catch(e){ err.textContent=L("e_net"); btn.disabled=false; }
  };
  $("#flogin").onsubmit=e=>{ e.preventDefault(); go(e.target,false); };
  $("#freg").onsubmit=e=>{ e.preventDefault(); go(e.target,true); };
}

function fitShowName(){
  const el=document.querySelector(".show .fname"), sh=document.querySelector(".show"); if(!el||!sh||!el.style) return;
  el.style.fontSize=""; el.style.maxWidth=Math.round(sh.clientWidth*.7)+"px";
  let fs=parseFloat(getComputedStyle(el).fontSize), lh=()=>parseFloat(getComputedStyle(el).fontSize)*1.05;

function currentReact(){
  if(S.react) return S.react;
  if(MODE==="vs" && S.pending && S.pending.def===ME && NET.answered!==S.pending.id){
    return { c:CARDS[S.pending.c], dmg:S.pending.dmg, options:S[ME].hand.filter(h=>S.pending.opts.includes(h.uid)), remote:true };
  }
  return null;
}

/* ---------- versus en ligne ---------- */
const NET={names:{},db:null,user:null,uid:null,ref:null,unsub:null,role:null,seq:0,lastSeq:0,pushT:null,handoff:false,pend:null,rid:0,answered:null,team:null};
async function netInit(){
  if(NET.db) return true;
  try{ NET.db = window.claude ? await window.claude.use("db") : null; NET.user = window.claude ? await window.claude.use("user") : null; }catch(e){ NET.db=null; }
  if(!NET.db || !NET.user) return false;
  try{ NET.uid = await NET.user.id(); }catch(e){ NET.uid=null; }
  return !!NET.uid;
}
function netSnapshot(){ const o=Object.assign({},S); delete o.react; o.uidMax=UID; return JSON.stringify(o); }
function schedulePush(){
  if(MODE!=="vs" || REPLAY || !NET.ref) return;
  if(!(S.turn===ME || NET.handoff)) return;
  clearTimeout(NET.pushT); NET.pushT=setTimeout(netPush,120);
}
async function netPush(){
  if(!NET.ref || !S) return;
  const handed = S.turn!==ME;
  NET.seq=Math.max(NET.seq,NET.lastSeq)+1; NET.lastEv=S.evn||0;
  try{ await NET.ref.update({state:netSnapshot(), seq:NET.seq, author:NET.uid, status:S.over?"over":"playing"}); }
  catch(e){ console.warn("push",e&&e.code); }
  if(handed) NET.handoff=false;
}
function askRemote(c,dmg,options){
  return new Promise(res=>{
    const id=++NET.rid + "-" + Date.now();
    S.pending={id, def:OPPK(), c:c.key, dmg, opts:options.map(o=>o.uid)};
    NET.pend={id,res,options};
    clearTimeout(NET.pushT); netPush(); render();
  });
}
function answerRemote(uid){
  if(!S.pending) return;
  NET.answered=S.pending.id;
  NET.ref.update({answer:{id:S.pending.id, uid}}).catch(()=>{});
  render();
}
function applyRemote(d, force){
  if(!d.state) return;
  if(!force && (d.author===NET.uid || (d.seq||0)<=NET.lastSeq)) return;
  NET.lastSeq=d.seq||0; NET.seq=Math.max(NET.seq,NET.lastSeq);
  const prevEv = NET.lastEv||0;
  const st=JSON.parse(d.state); st.react=null;
  S=st; UID=Math.max(UID, st.uidMax||0);
  REPLAY=true; try{ (S.ev||[]).filter(e=>e[0]>prevEv).forEach(replayEv); } finally { REPLAY=false; }
  NET.lastEv=S.evn||0;
  render();
  if(S.over){ const lost=S[ME].team.every(t=>t.ko); setTimeout(()=>{ if(MODE==="vs") renderEnd(!lost); },1400); }
}
function onDuel(snap){
  if(!snap.exists) return;
  const d=snap.data();
  NET.names={host:d.hostName||"P1",guest:d.guestName||"P2"};
  const chatChanged=onChatData(d);
  if(NET.role==="host" && d.status==="ready" && !d.state && !NET.started){
    NET.started=true; MODE="vs"; ME="p";
    newGame(d.hostTeam); S.a=makeSide(d.guestTeam); S.names={p:d.hostName||"P1", a:d.guestName||"P2"}; journalReset(); NET.code=d.code; accMatchJoin();
    S.log=L("turnOf",who("p")); render(); clearTimeout(NET.pushT); netPush();
    return;
  }
  if(d.state){
    if(!NET.started){ NET.started=true; MODE="vs"; ME = NET.role==="host" ? "p" : "a"; applyRemote(d,true); NET.code=d.code; accMatchJoin(); }
    else applyRemote(d,false);
  }
  if(NET.pend && d.answer && d.answer.id===NET.pend.id){
    const pe=NET.pend; NET.pend=null; S.pending=null;
    pe.res(d.answer.uid==null ? null : (pe.options.find(o=>o.uid===d.answer.uid)||null));
  }
  if(NET.role==="host" && d.status==="waiting" && !NET.started) renderWaiting(d.code);
  if(chatChanged && NET.started && S && !d.state) render();
  else if(chatChanged && NET.started && S && d.seq===NET.lastSeq) render();
}
function netLeave(){ try{ NET.unsub && NET.unsub(); }catch(e){} journalReset(); Object.assign(NET,{names:{},ref:null,unsub:null,role:null,started:false,pend:null,answered:null,seq:0,lastSeq:0,lastEv:0,handoff:false}); MODE="solo"; ME="p"; S=null; }

function quickStop(){ clearInterval(QUICK_MM.timer); QUICK_MM.timer=0; if(QUICK_MM.t){ const t=QUICK_MM.t; QUICK_MM.t=null; fetch("/api/mm/leave",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t}),keepalive:true}).catch(()=>{}); } }

  if(!r.t){ scr(`<p class="lead">${L("netErr")}</p>`); return; }

  draw(r.n||1);

  },1500);

  ["relay",  (p,my)=>my && S.round>=2 && p.hand.some(c=>{ const o=CARDS[c.k].owner; return CARDS[c.k].kind==="atk" && o && o!==act(p).id && p.team.some(t=>t.id===o && !t.ko); })],
  ["terrain",(p,my)=>my && S.round>=2 && p.hand.some(c=>CARDS[c.k].kind==="terr")],
  ["trap",   (p,my)=>my && S.round>=2 && p.hand.some(c=>CARDS[c.k].kind==="trap")],
  ["special",(p,my)=>my && S.round>=2 && p.hand.some(c=>CARDS[c.k].kind==="spec")],
  ["rage",   (p,my)=>my && p.rage>=RAGE_MAX],
  ["event",  ()=>!!S.evName],
  ["ko",     ()=>S.p.team.some(t=>t.ko) || S.a.team.some(t=>t.ko)],
  ["endturn",(p,my)=>my && !p.hand.some(c=>canPlay(ME,c)) && p.rage<RAGE_MAX]
];
function startTuto(){
  journalReset();
  MODE="tuto"; ME="p"; TUTO.seen={}; TUTO.open=false;
  S = { p:makeSide(["maitre","dans","sage"]), a:makeSide(["ventre","fourbe","rival"]), terrain:null, round:0, turn:null, busy:true, over:false, react:null, log:L("start"), sub:"" };
  startTurn("p");
}
function tutoCheck(){
  if(TUTO.open || !S || S.over) return;
  const p=S.p, my=S.turn==="p" && !S.busy && !S.react;
  const tip=TIPS.find(([id,cond])=>!TUTO.seen[id] && cond(p,my));
  if(!tip) return;
  TUTO.seen[tip[0]]=true; TUTO.open=true;
  const w=document.createElement("div"); w.className="coachwrap";
  w.innerHTML=`<div class="coach" role="dialog" aria-label="${L("tuto")}"><div class="kicker">${L("tuto")}</div><p>${L("tip_"+tip[0])}</p><button class="btn" id="coachok">${L("ok")}</button></div>`;
  document.body.appendChild(w);
  w.querySelector("#coachok").onclick=()=>{ w.remove(); TUTO.open=false; SFX.play("click"); tutoCheck(); };
}

(function particles(){
  const cv=document.getElementById("fxcanvas"); if(!cv || reduced || !cv.getContext) return;
  const cx=cv.getContext("2d"); let W,H,P=[];
  function size(){ W=cv.width=innerWidth*(devicePixelRatio>1?1.5:1); H=cv.height=innerHeight*(devicePixelRatio>1?1.5:1); }
  size(); addEventListener("resize",size);
  function spawn(init){ const ember=Math.random()<.35; return {x:Math.random()*W, y:init?Math.random()*H:H+10, vx:(Math.random()-.5)*.3+(ember?0:.6), vy:ember?-(.4+Math.random()*.9):-(.05+Math.random()*.25), r:ember?1+Math.random()*1.8:.6+Math.random()*1.4, a:0, life:0, max:300+Math.random()*500, ember}; }
  for(let i=0;i<70;i++) P.push(spawn(true));
  function tick(){
    if(!document.hidden){
      cx.clearRect(0,0,W,H);
      for(const p of P){
        p.life++; p.x+=p.vx+Math.sin((p.life+p.y)/60)*.25; p.y+=p.vy;
        p.a=Math.min(1,p.life/60)*Math.max(0,1-p.life/p.max);
        cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283);
        cx.fillStyle=p.ember?`rgba(255,${120+Math.floor(Math.random()*60)},40,${p.a*.9})`:`rgba(216,193,155,${p.a*.35})`;
        if(p.ember){ cx.shadowColor="rgba(255,120,40,.9)"; cx.shadowBlur=8; } else cx.shadowBlur=0;
        cx.fill();
        if(p.life>p.max || p.y<-10 || p.x>W+10) Object.assign(p,spawn(false));
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
document.documentElement.lang=LANG;
renderTitle(); facesLoad(); accInit().then(statusStart); setTimeout(newsToast,1500);
</script>
