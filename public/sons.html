<meta charset="utf-8">

<title>Sons du jeu · Battle of the Century</title>
<style>
:root{--bg:#120d0b;--panel:#1d1511;--line:#3d2b1c;--txt:#efe4d2;--mute:#9c8a74;--gold:#e8b04a;--red:#c8442a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(18,13,11,.97);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{margin:0 10px 0 0;font-size:19px;color:var(--gold);letter-spacing:.5px}
input[type=range]{accent-color:var(--gold)}
input[type=search]{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:160px;flex:1;max-width:260px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.vol{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-left:auto}
main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid transparent;margin-bottom:6px}
.row.playing{border-color:var(--gold)}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.row.playing .play{background:var(--gold);color:#1a120c}
.info{flex:1;min-width:0}
.n{font-weight:700;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.u{color:var(--mute);font-size:13px}
.bar{height:3px;background:#2c2018;border-radius:2px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}
.d{flex:none;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;width:46px;text-align:right}
.cat-Pas .row{opacity:.6}
.empty{color:var(--mute);text-align:center;padding:40px}
@media (max-width:600px){.vol{margin-left:0}}
</style>
</head>
