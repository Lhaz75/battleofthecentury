# Publie les images, sons et musiques du jeu sur GitHub Pages (gratuit),
# pour que le serveur Render n'ait plus à les envoyer (quota de bande passante).
name: Images sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers
        run: |
          mkdir -p _site
          cp -r public/assets public/sfx public/music _site/
          (cd public && find assets sfx music -type f -printf '%p:%s\n' | LC_ALL=C sort | sha1sum | cut -c1-40) > _site/cdn-version.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
